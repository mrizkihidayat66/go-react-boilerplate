services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      # Generate with: openssl rand -hex 32
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env or the environment}
      # Set to your origin when serving behind a reverse proxy over HTTPS.
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # Leave unset in real deployments (auth cookies become Secure in
      # production). Set to false to review this production build over
      # plain HTTP, e.g. a local VM at an IP address where browsers reject
      # Secure cookies.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
    volumes:
      - app-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  app-data:
